name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and Golden Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: EchoMindJava

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache BGE ONNX model
        uses: actions/cache@v4
        with:
          path: EchoMindJava/models/bge-small-zh-v1.5
          key: ${{ runner.os }}-bge-small-zh-v1.5-${{ hashFiles('EchoMindJava/scripts/download-bge-small-zh-v1.5.ps1') }}

      - name: Download and verify BGE ONNX model
        shell: pwsh
        run: ./scripts/download-bge-small-zh-v1.5.ps1

      - name: Verify BGE model files are present
        shell: pwsh
        run: |
          $required = @(
            "models/bge-small-zh-v1.5/model.onnx",
            "models/bge-small-zh-v1.5/tokenizer.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required BGE file missing: $path"
            }
          }

      - name: Pull MySQL test image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker pull mysql:8.4; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run backend test suite
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

      - name: Assert Golden release gate and no skipped E2E
        shell: pwsh
        run: |
          ./scripts/assert-golden-evaluation.ps1 `
            -ReportDirectory target/golden-e2e/reports `
            -SurefireDirectory target/surefire-reports

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: EchoMindJava/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Golden evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evaluation-reports
          path: EchoMindJava/target/golden-e2e/reports/**
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EchoMindFrontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EchoMindFrontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build production frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: EchoMindFrontend/dist/**
          if-no-files-found: error
          retention-days: 14
